<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step screen v2 prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2;--card:#ffffff;--paper:#f8f8f6;--line:#e4e4e0;--text:#25272a;--soft:#62666b;--muted:#92969b;
  --sage:#587a67;--sage-d:#2f4a3c;--sage-w:#e4eee4;--clay:#3f6b57;--clay-w:#e4eee4;--blue:#2f63d6;
  --ui:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--serif:var(--ui);
}
*{box-sizing:border-box}
body{margin:0;background:#e6e6e3;font-family:var(--ui);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;font-size:13px;padding:0 12px}
.ctl button{border:1px solid #d2d2cd;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer;color:var(--text)}
.ctl button.on{background:var(--sage-d);color:#fff;border-color:var(--sage-d)}
.ctl label{display:flex;align-items:center;gap:4px;padding:6px 4px}
.phone{width:375px;height:780px;max-height:calc(100vh - 90px);background:var(--bg);border:1px solid #d2d2cd;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
@media(max-width:420px){.phone{width:100vw;border-radius:0;border-left:0;border-right:0}}
.tb{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;flex:none}
.tb .back,.tb .more{width:36px;height:36px;border:0;border-radius:10px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-size:18px;line-height:1;cursor:pointer;color:var(--text);flex:none}
.tb .more{background:none;box-shadow:none;color:var(--soft);width:30px}
.tb .pdf{width:36px;height:36px;border:0;border-radius:10px;background:var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;color:var(--sage-d);flex:none;display:flex;align-items:center;justify-content:center;padding:0}
.tb .ttl{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1;border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit}
.tb .proj{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.tb .sec{font-family:var(--serif);color:var(--text);font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tb .tally{font-size:12px;color:var(--muted);white-space:nowrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.tb .tally b{color:var(--sage-d);font-weight:700}
.main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 16px 12px}
.card{flex:1 0 33%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 20px 16px;display:flex;flex-direction:column}
.card.nochart{flex:0 0 auto}
.rowline{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:4px}
.rowline b{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--soft)}
.setup{margin:14px 0 0;font-size:14px;line-height:1.5;color:var(--soft)}
.setup button{border:0;background:none;padding:0;font:inherit;color:var(--clay);cursor:pointer;font-weight:700;font-size:11px;letter-spacing:.1em}
.setup p{margin:8px 0 0;padding-left:12px;border-left:2px solid var(--clay)}
.panel{margin-top:14px;flex:1;display:flex;flex-direction:column}
.ins{font-family:var(--serif);font-size:25px;font-weight:500;line-height:1.28;margin:0 0 14px;letter-spacing:-.005em}
.panel .ins{margin:0 0 20px}
.facts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;justify-content:space-between;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.count{color:var(--soft)}
.count b{font-weight:700;color:var(--sage-d);font-size:15px}
.check{color:var(--sage-d);font-size:13px;border-left:2px solid var(--clay);padding-left:10px}
.check b{letter-spacing:.08em;font-size:10.5px;margin-right:4px}
.pass{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pass .pl{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.pass .pn{font-family:var(--serif);font-weight:600;font-size:18px}
.pass button{width:36px;height:36px;border-radius:10px;border:0;box-shadow:0 0 0 1px var(--line);background:var(--paper);font-size:18px;cursor:pointer;color:var(--text)}
.pass .sp{flex:1}
.rl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rl li{display:flex;gap:12px;align-items:baseline;padding:12px 14px;border-radius:8px;font-size:15px;line-height:1.4;color:var(--soft);cursor:pointer}
.rl li.sel{background:var(--paper);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:var(--serif);font-size:20px;font-weight:500;padding:12px 14px}
.rl li.done{color:var(--muted)}
.rl .rn{font-family:var(--ui);font-size:11px;letter-spacing:.08em;width:24px;flex:none;font-weight:700}
.rl .rt{flex:1}
.rl .rc{font-family:var(--ui);font-size:13px;color:var(--muted);flex:none;font-weight:500}
.rl li.sel .rc{color:var(--sage-d);font-weight:700}
.endpass{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:12px 14px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.endpass b{color:var(--sage-d);font-weight:700;font-size:15px}
.chartwrap{flex:1 1 67%;min-height:205px;display:flex;flex-direction:column;min-width:0;gap:10px;margin:0 -16px}
.chartwrap.hide{display:none}
.chartbox{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;overflow:hidden}
.chart{flex:1;overflow:auto;padding:4px 0 12px;--cs:21px}
.cr{display:flex;align-items:center;gap:2px;justify-content:center;border-radius:0;padding:2px 0}
.cr.cur{background:var(--sage-w);border-radius:0}
.cr .n{width:24px;text-align:center;font-size:10.5px;color:#b4b7ba;flex:none}
.cr.cur .n{color:var(--blue);font-weight:700;font-size:12px}
.cell{width:var(--cs);height:var(--cs);border-radius:5px;background:#efefec;display:flex;align-items:center;justify-content:center;font-size:11px;color:#2c2e31;flex:none}
.cell.w{background:#efefec}
.cr.cur .cell{background:#fff}
.cr.cur .cell.w{background:#fff}
.cell svg{width:100%;height:100%;display:block}
.lgi{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lgi i{width:18px;height:18px;display:inline-block;background:#efefec;border-radius:4px;color:#2c2e31}
.lgi i svg{width:100%;height:100%;display:block}
.lgmore{color:var(--muted)}
.legend .gl{margin-left:auto;width:36px;height:36px;border:0;border-radius:10px;background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--sage-d);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.colnums{display:flex;justify-content:center;gap:2px;padding:12px 0 0}
.colnums i{width:var(--cs,19px);text-align:center;font-style:normal;font-size:10.5px;color:#b0b3b6;flex:none}
.colnums .n{width:24px;flex:none}
.legend{flex:none;display:flex;gap:14px;align-items:center;padding:0 16px 2px;font-size:12.5px;color:var(--soft);flex-wrap:nowrap;overflow:hidden}
.legend a{margin-left:auto;color:var(--sage-d);font-weight:700;text-decoration:none;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 12px}
.chip{display:none;flex:none;margin:0 16px 8px;padding:8px 8px 8px 14px;background:#e9e9e6;border-radius:10px;font-size:12.5px;color:var(--soft);align-items:center;justify-content:space-between}
.chip.show{display:flex}
.chip button{border:0;background:var(--sage-d);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.dock{flex:none;display:flex;gap:10px;padding:12px 16px 20px;align-items:stretch}
.dock .nav{width:52px;height:54px;border-radius:12px;border:0;box-shadow:0 0 0 1px var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--text)}
.dock .main-btn{flex:1;height:54px;border-radius:12px;border:0;background:var(--sage-d);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:.005em}
.dock .main-btn.undo{background:var(--card);color:var(--sage-d);box-shadow:inset 0 0 0 1.5px var(--sage-d)}
.sheet{position:absolute;inset:0;background:rgba(30,32,35,.38);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.sheet .in{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:22px 20px 28px;max-height:82%;overflow:auto}
.sheet h3{margin:0 0 10px;font-family:var(--serif);font-size:19px;font-weight:600}
.sheet h4{margin:18px 0 6px;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.sheet p,.sheet li{font-size:14px;line-height:1.5}
.sheet ul{padding-left:0;list-style:none;margin:0}
.sheet li{padding:10px 0;border-bottom:1px solid var(--line)}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.sheet .btns button{flex:1;height:48px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1.5px var(--sage-d);background:var(--card);color:var(--sage-d);font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.sheet .btns button.go{background:var(--sage-d);color:#fff}
.sheet li.cur{font-weight:700;color:var(--sage-d)}
.sheet .x{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:var(--soft)}
.main.list{gap:0;padding-top:0}
.main.list>*{flex:none}
.lh{padding:4px 4px 14px}
.lh .r1{display:flex;justify-content:space-between;align-items:baseline}
.lh .cap{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--soft)}
.lh .pg{font-size:12px;color:var(--muted)}.lh .pg b{color:var(--sage-d)}
.lh .bar{height:3px;background:var(--line);border-radius:2px;margin:8px 0 12px;overflow:hidden}
.lh .bar i{display:block;height:100%;background:var(--sage)}
.lh p{margin:0;font-size:14px;line-height:1.5;color:var(--soft)}
.nt{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--soft);cursor:pointer}
.nt span:last-child{color:var(--sage-d);letter-spacing:.04em;font-size:12px}
.nt+.ntx{margin:-8px 0 14px;font-size:14px;line-height:1.5;color:var(--soft);padding:0 4px}
.pr{display:flex;gap:12px;align-items:baseline;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4;cursor:pointer}
.pr .rn{font-size:11px;letter-spacing:.08em;width:30px;flex:none;font-weight:700;color:var(--muted)}
.pr .rt{flex:1}
.pr .rc{font-size:13px;color:var(--muted);flex:none}
.pr.done{color:var(--muted)}
.pr.done .rn::after{content:' \2713';color:var(--sage)}
.pr .tag{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--sage-d);display:block;margin-top:2px}
.sel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.sel .top{padding:16px 16px 0 18px}
.sel .ins{font-size:21px;cursor:pointer;margin:12px 0 16px}
.sel .prev{border-top:1px solid var(--line);padding:2px 0 8px;overflow:hidden}
.sel .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.sel .foot .facts{border:0;padding:0;margin:0;flex:1}
.sel .acts{display:flex;gap:8px;padding:0 16px 16px 18px}
.sel .acts button{flex:1;height:44px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1.5px var(--sage-d);background:var(--card);color:var(--sage-d);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.sel .acts button.q{flex:1;padding:0 16px;box-shadow:0 0 0 1px var(--line);color:var(--soft);font-weight:500}
.note{max-width:420px;font-size:12px;color:var(--soft);text-align:center;margin-top:10px;padding:0 12px}
</style>
</head>
<body>
<div class="ctl" id="ctl"></div>
<div class="phone" id="phone"></div>
<div class="note">Prototype of docs/step-screen-v2-requirements.md. Mock data; nothing is saved.</div>

<script>
// Symbols copied from js/core/chart.js (SYMS), which come from the app's Figma Stitches set.
const SYMS = {"P": "<svg width=\"100%\" height=\"100%\" viewBox=\"0 0 24 24\" style=\"display:block\"><rect x=\"8\" y=\"8\" width=\"8\" height=\"8\" rx=\"4\" fill=\"currentColor\" /></svg>", "YO": "<svg width=\"100%\" height=\"100%\" viewBox=\"0 0 24 24\" style=\"display:block\"><path fill-rule=\"evenodd\" clip-rule=\"evenodd\" d=\"M12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM12.0001 17.7143C15.156 17.7143 17.7143 15.1559 17.7143 12C17.7143 8.84408 15.156 6.28571 12.0001 6.28571C8.84414 6.28571 6.28577 8.84408 6.28577 12C6.28577 15.1559 8.84414 17.7143 12.0001 17.7143Z\" fill=\"currentColor\" /></svg>", "K2": "<svg width=\"100%\" height=\"100%\" viewBox=\"0 0 24 24\" style=\"display:block\"><path d=\"M20 4V20H4L20 4Z\" fill=\"currentColor\" /></svg>", "SK": "<svg width=\"100%\" height=\"100%\" viewBox=\"0 0 24 24\" style=\"display:block\"><path d=\"M4 4V20H20L4 4Z\" fill=\"currentColor\" /></svg>"};
const SYM = { '': '', o: SYMS.YO, r: SYMS.K2, l: SYMS.SK, '.': SYMS.P };
const LEG = { '': ['', 'Knit'], o: [SYMS.YO, 'YO'], r: [SYMS.K2, 'k2tog'], l: [SYMS.SK, 'SKPO'], '.': [SYMS.P, 'Purl'] };

function mkYoke() {
  const rows = [], counts = [];
  let n = 88;
  for (let r = 1; r <= 24; r++) {
    const g = [];
    for (let c = 0; c < 14; c++) {
      let t = '';
      if (r % 2 === 1) {
        if (c % 4 === 3) t = 'o';
        else if (c % 4 === 0 && c > 0 && r % 4 === 1) t = 'r';
        else if (c === 12 && r % 4 === 3) t = 'l';
      } else if (c >= 11) t = '.';
      g.push(t);
    }
    n += g.filter(t => t === 'o').length - g.filter(t => t === 'r' || t === 'l').length;
    rows.push(g); counts.push(n);
  }
  return { rows, counts };
}
const YOKE = mkYoke();

const WRITTEN = [
  { t: 'With US 4 (3.5 mm) needles and the front body RS facing, pick up and k41 sts from the CO edge of the left shoulder.', c: 41 },
  { t: 'Set-up row (WS): P10, *k2, p13* rep to 1 st bef end, k1.', c: 41, setup: 'Working in pattern: RS rows are worked from the neck side to the armhole side: work [k13, p2] until the last stitch, which is p1. WS rows are worked from the armhole side: k1, then work [p13, k2]. For the neckline increases, use the backward-loop cast on.' },
  { t: '[Neckline increase: backward-loop cast on.] Row 3 (RS): DS, work in pattern neck to armhole to end, CO 2 sts. 2 sts inc’d.', c: 44, check: '3 sts between the DS and the marker', setup: 'Working in pattern: RS rows are worked from the neck side to the armhole side: work [k13, p2] until the last stitch, which is p1.' }
];

const REPEAT = {
  rows: [
    { t: 'Inc row (RS): K2, m1, knit to last 2 sts, m1, k2.', inc: 2 },
    { t: 'Row 2 (WS): Purl.', inc: 0 },
    { t: 'Row 3 (RS): *K3, yo, k2tog* to last 2 sts, k2.', inc: 0 },
    { t: 'Row 4 (WS): Purl.', inc: 0 }
  ],
  passes: 6, start: 64
};
const MOTIF = (() => { const m = []; for (let r = 0; r < 4; r++) { const g = []; for (let c = 0; c < 8; c++) g.push(r % 2 === 0 ? (c === 3 ? 'o' : c === 4 ? 'r' : '') : ''); m.push(g); } return m; })();

const S = { list: false, notesOpen: false, confirm: null, mode: 'chart', view: 3, cur: 3, setupOpen: false, hideCount: false, longIns: false, sheet: null };

function setMode(m) {
  S.mode = m; S.sheet = null; S.setupOpen = false;
  if (m === 'chart') { S.view = 3; S.cur = 3; }
  if (m === 'written') { S.view = 2; S.cur = 2; }
  if (m === 'repeat') { S.view = 9; S.cur = 9; }
  render();
}
function total() { return S.mode === 'chart' ? 24 : S.mode === 'written' ? 3 : REPEAT.rows.length * REPEAT.passes; }

function done() {
  const tot = total();
  if (S.view < S.cur - 1) { S.confirm = { kind: 'undo', from: S.view + 1, to: S.cur }; return render(); }
  if (S.view > S.cur) { S.confirm = { kind: 'ahead', from: S.cur + 1, to: S.view + 1 }; return render(); }
  commit();
}
function commit() {
  S.confirm = null;
  if (S.view < S.cur) { S.cur = S.view; }
  else { S.cur = S.view + 1; S.view = Math.min(S.cur, total() - 1); }
  S.cur = Math.min(S.cur, total());
  render();
}
function browse(d) { S.view = Math.max(0, Math.min(total() - 1, S.view + d)); render(); }
function pick(i) { S.view = i; render(); }
function pass(d) {
  const L = REPEAT.rows.length, p = Math.floor(S.cur / L), inPass = S.cur % L;
  if (d > 0) S.cur = Math.min(total(), (p + 1) * L);
  else S.cur = inPass > 0 ? p * L : Math.max(0, (p - 1) * L);
  S.view = Math.min(S.cur, total() - 1);
  render();
}
function toggleSetup() { S.setupOpen = !S.setupOpen; render(); }
function sheet(k) { S.sheet = k; render(); }

function chartHtml(grid, curIdx, cols) {
  const top = '<div class="colnums"><span class="n"></span>' + Array.from({ length: cols }, (_, i) => '<i>' + (cols - i) + '</i>').join('') + '<span class="n"></span></div>';
  let rows = '';
  for (let r = grid.length - 1; r >= 0; r--) {
    const cur = r === curIdx;
    rows += '<div class="cr' + (cur ? ' cur' : '') + '" data-cur="' + (cur ? 1 : 0) + '"><span class="n">' + (r + 1) + '</span>' +
      grid[r].map((t, c) => '<div class="cell ' + (t === 'o' ? 'o ' : '') + (c >= cols / 2 ? 'w' : '') + '">' + SYM[t] + '</div>').join('') +
      '<span class="n">' + (r + 1) + '</span></div>';
  }
  return top + '<div class="chart">' + rows + '</div>';
}

function legendHtml(grid) {
  const used = [...new Set(grid.flat())].filter(k => k !== '');
  const shown = used.slice(0, 3), more = used.length - shown.length;
  const item = k => '<span class="lgi"><i>' + LEG[k][0] + '</i>' + LEG[k][1] + '</span>';
  return '<div class="legend"><span class="lgi"><i></i>Knit</span>' + shown.map(item).join('') + (more > 0 ? '<span class="lgmore">+' + more + '</span>' : '') +
    '<button class="gl" aria-label="Glossary" onclick="sheet(\'glossary\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 0 4 21.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 1 1.5 1.5z"/></svg></button></div>';
}

function cardChart() {
  const r = S.view, rs = r % 2 === 0;
  const ins = S.longIns ? 'Row ' + (r + 1) + ' (' + (rs ? 'RS' : 'WS') + '): K2, yo, k2tog, *k3, yo, k2tog, k1, SKPO, yo* rep to last 4 sts, k2, yo, k2tog. Slip the marker as you come to it and keep the yarn at the back of the work throughout.' : (rs ? 'K9, yo, k2tog, k3' : 'P14');
  const setup = 'RS rows are worked from the neck edge to the armhole edge. Read the chart right to left on RS rows and left to right on WS rows.';
  return '<div class="rowline"><b>ROW ' + (r + 1) + ' OF 24</b><span>' + (rs ? 'RS · read right → left' : 'WS · read left → right') + '</span></div>' +
    setupHtml(setup) + '<div class="panel"><div class="ins">' + ins + '</div>' + factsHtml(YOKE.counts[r], r === 4 ? 'Row should measure 2 cm' : null) + '</div>';
}
function cardWritten() {
  const w = WRITTEN[S.view];
  return '<div class="rowline"><b>ROW ' + (S.view + 1) + ' OF 3</b><span>WS</span></div>' +
    (w.setup ? setupHtml(w.setup) : '') + '<div class="panel"><div class="ins">' + w.t + '</div>' + factsHtml(w.c, w.check) + '</div>';
}
function setupHtml(t) {
  return '<div class="setup"><button onclick="toggleSetup()">SETUP ' + (S.setupOpen ? '▾' : '▸') + '</button>' + (S.setupOpen ? '<p>' + t + '</p>' : '') + '</div>';
}
function factsHtml(count, check) {
  if (S.hideCount && !check) return '';
  return '<div class="facts">' + (S.hideCount ? '<span></span>' : '<span class="count"><b>' + count + '</b> sts</span>') +
    (check ? '<span class="check"><b>CHECK</b> ' + check + '</span>' : '') + '</div>';
}
function cardRepeat() {
  const L = REPEAT.rows.length, viewPass = Math.floor(S.view / L), curPass = Math.floor(S.cur / L);
  const pStart = REPEAT.start + 2 * viewPass;
  const items = REPEAT.rows.map((row, i) => {
    const lin = viewPass * L + i, sel = lin === S.view, dn = lin < S.cur;
    return '<li class="' + (sel ? 'sel ' : '') + (dn ? 'done' : '') + '" onclick="pick(' + lin + ')"><span class="rn">R' + (i + 1) + '</span><span class="rt">' + row.t + '</span>' +
      (S.hideCount ? '' : '<span class="rc">' + (pStart + (i === 0 ? 2 : 2)) + '</span>') + '</li>';
  }).join('');
  return '<div class="pass"><span class="pl">REPEAT</span><span class="pn">Pass ' + (viewPass + 1) + ' of ' + REPEAT.passes + '</span><span class="sp"></span>' +
    '<button aria-label="Previous pass" onclick="pass(-1)">−</button><button aria-label="Next pass" onclick="pass(1)">+</button></div>' +
    '<ul class="rl">' + items + '</ul>' +
    (S.hideCount ? '' : '<div class="endpass"><span>End of pass ' + (viewPass + 1) + '</span><b>' + (pStart + 2) + ' sts</b></div>');
}

function chartTxt(r) { return r % 2 === 0 ? 'K9, yo, k2tog, k3' : 'P14'; }
function miniChart(grid, idx, cols) {
  const lo = Math.max(0, idx - 1), hi = Math.min(grid.length - 1, idx + 1);
  let out = '<div class="colnums"><span class="n"></span>' + Array.from({ length: cols }, (_, i) => '<i>' + (cols - i) + '</i>').join('') + '<span class="n"></span></div><div class="chart" style="overflow:visible;padding-bottom:4px">';
  for (let r = hi; r >= lo; r--) {
    const cur = r === idx;
    out += '<div class="cr' + (cur ? ' cur' : '') + '"><span class="n">' + (r + 1) + '</span>' + grid[r].map(t => '<div class="cell">' + SYM[t] + '</div>').join('') + '<span class="n">' + (r + 1) + '</span></div>';
  }
  return out + '</div>';
}
function playlistHtml() {
  const m = S.mode, tot = total(), L = REPEAT.rows.length;
  const secDesc = m === 'chart' ? 'Work the yoke chart in the round, bottom to top.' : m === 'written' ? 'Pick up from the left shoulder edge.' : 'Four-row leaf panel, repeated six times.';
  const pct = Math.round(100 * S.cur / tot);
  let h = '<div class="lh"><div class="r1"><span class="cap">INSTRUCTIONS</span><span class="pg"><b>' + S.cur + '</b> / ' + tot + ' rows \u00b7 ' + pct + '%</span></div><div class="bar"><i style="width:' + pct + '%"></i></div><p>' + secDesc + '</p></div>' +
    '<div class="nt" onclick="S.notesOpen=!S.notesOpen;render()"><span>SECTION NOTES</span><span>' + (S.notesOpen ? 'hide' : 'view') + '</span></div>' +
    (S.notesOpen ? '<div class="ntx">Work the chart with the RS facing. Place a marker after each repeat of the panel.</div>' : '');
  if (m === 'repeat') {
    return h + '<div class="card" style="flex:none">' + cardRepeat() + '</div>';
  }
  for (let i = 0; i < tot; i++) {
    const done = i < S.cur, isCur = i === S.cur, sel = i === S.view;
    const txt = m === 'chart' ? chartTxt(i) : WRITTEN[i].t;
    const cnt = m === 'chart' ? YOKE.counts[i] : WRITTEN[i].c;
    if (sel) {
      const grid = YOKE.rows;
      const rs = i % 2 === 0;
      const chk = m === 'written' ? WRITTEN[i].check : (i === 4 ? 'Row should measure 2 cm' : null);
      h += '<div class="sel"><div class="top"><div class="rowline"><b>ROW ' + (i + 1) + (isCur ? ' \u00b7 CURRENT' : done ? ' \u00b7 DONE' : '') + '</b><span>' + (m === 'chart' ? (rs ? 'RS' : 'WS') : '') + '</span></div>' +
        '<div class="ins" onclick="S.list=false;render()">' + txt + '</div></div>' +
        (m === 'chart' ? '<div class="prev">' + miniChart(grid, i, 14) + '</div>' : '') +
        '<div class="foot">' + (S.hideCount ? '' : '<div class="facts"><span class="count"><b>' + cnt + '</b> sts</span>' + (chk ? '<span class="check"><b>CHECK</b>' + chk + '</span>' : '') + '</div>') + '</div>' +
        '<div class="acts"><button class="q" onclick="S.list=false;render()">Open row \u203a</button></div></div>';
    } else {
      h += '<div class="pr' + (done ? ' done' : '') + '" onclick="pick(' + i + ')"><span class="rn">R' + (i + 1) + '</span><span class="rt">' + txt + (isCur ? '<span class="tag">CURRENT ROW</span>' : '') + '</span>' + (S.hideCount ? '' : '<span class="rc">' + cnt + '</span>') + '</div>';
    }
  }
  return h;
}

function render() {
  const m = S.mode, tot = total();
  const secName = m === 'chart' ? 'Yoke chart' : m === 'written' ? 'Left back shoulder' : 'Leaf lace panel';
  const hasChart = m !== 'written';
  const L = REPEAT.rows.length;
  let card = m === 'chart' ? cardChart() : m === 'written' ? cardWritten() : cardRepeat();
  let chart = '', leg = '';
  if (m === 'chart') { chart = chartHtml(YOKE.rows, S.view, 14); leg = legendHtml(YOKE.rows); }
  if (m === 'repeat') { chart = chartHtml(MOTIF, S.view % L, 8); leg = legendHtml(MOTIF); }
  const rowN = S.view + 1;
  const isDone = S.view < S.cur;
  const rowLabel = m === 'repeat' ? 'R' + ((S.view % L) + 1) + ' of pass ' + (Math.floor(S.view / L) + 1) : 'row ' + rowN;
  const btn = isDone ? 'Mark ' + rowLabel + ' not done' : 'Mark ' + rowLabel + ' done';
  const browsing = S.view !== S.cur && S.cur < tot;
  const curTxt = m === 'repeat' ? 'row ' + ((S.cur % L) + 1) + ' of pass ' + (Math.floor(S.cur / L) + 1) : 'row ' + (S.cur + 1);
  const notes = '<h4>SECTION NOTES</h4><p>Work the chart with the RS facing. Place a marker after each repeat of the panel. Change to the 3 mm needle if your fabric is loose.</p>';
  const cf = S.confirm;
  const sheets = cf
    ? '<h3>' + (cf.kind === 'undo' ? 'Mark rows ' + cf.from + '\u2013' + cf.to + ' not done?' : 'Mark rows ' + cf.from + '\u2013' + cf.to + ' done?') + '</h3><p>' + (cf.kind === 'undo' ? 'Your place moves back to row ' + cf.from + '.' : 'Rows ' + cf.from + '\u2013' + (cf.to - 1) + ' haven\u2019t been marked yet. Your place moves past row ' + cf.to + '.') + '</p><div class="btns"><button onclick="S.confirm=null;render()">Cancel</button><button class="go" onclick="commit()">' + (cf.kind === 'undo' ? 'Mark not done' : 'Mark done') + '</button></div>'
    : S.sheet === 'pdf'
      ? '<h3>Original pattern <button class="x" onclick="sheet(null)">×</button></h3><p>Peacock Tee, as the designer wrote it. It opens in a new tab and doesn\u2019t change your place.</p><div class="btns"><button class="go" onclick="sheet(null)">Open PDF</button></div>'
    : S.sheet === 'glossary'
    ? '<h3>Glossary <button class="x" onclick="sheet(null)">×</button></h3><h4>THIS PATTERN</h4><ul><li><b>DS</b> – double stitch: turn the work, slip the first stitch purlwise and pull the yarn up over the needle.</li></ul><h4>GENERAL</h4><ul><li><b>YO</b> – yarn over: bring the yarn to the front, then over the needle.</li><li><b>k2tog</b> – knit two together, leaning right.</li><li><b>SKPO</b> – slip one, knit one, pass the slipped stitch over.</li><li><b>m1</b> – make one: lift the strand between stitches and knit into the back of it.</li></ul>'
    : S.sheet === 'section'
      ? '<h3>' + secName + ' <button class="x" onclick="sheet(null)">×</button></h3>' + notes + '<h4>SECTIONS</h4><ul><li>Collar</li><li class="' + (m === 'chart' ? 'cur' : '') + '">Yoke chart</li><li class="' + (m === 'repeat' ? 'cur' : '') + '">Leaf lace panel</li><li class="' + (m === 'written' ? 'cur' : '') + '">Left back shoulder</li><li>Finishing</li></ul>'
      : '';
  document.getElementById('phone').innerHTML =
    '<div class="tb"><button class="back" aria-label="Back to playlist">‹</button><button class="ttl" onclick="sheet(\'section\')"><span class="proj">Peacock Tee</span><span class="sec">' + secName + ' ⌄</span></button><span class="tally"><b>' + Math.min(S.cur, tot) + '</b> / ' + tot + ' rows</span><button class="pdf" aria-label="Original pattern PDF" onclick="sheet(\'pdf\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></button><button class="more" aria-label="Options">⋮</button></div>' +
    (S.list ? '<div class="main list">' + playlistHtml() + '</div>' : '<div class="main"><div class="card' + (hasChart ? '' : ' nochart') + '">' + card + '</div>' +
    (hasChart ? '<div class="chartwrap"><div class="chartbox">' + chart + '</div>' + leg + '</div>' : '') + '</div>') +
    '<div class="chip' + (browsing ? ' show' : '') + '"><span>Viewing ' + (m === 'repeat' ? 'row ' + ((S.view % L) + 1) : 'row ' + rowN) + ' · on ' + curTxt + '</span><button onclick="S.view=Math.min(S.cur,' + (tot - 1) + ');render()">Back to current</button></div>' +
    '<div class="dock"><button class="nav" aria-label="Previous row" onclick="browse(-1)">‹</button><button class="main-btn' + (isDone ? ' undo' : '') + '" onclick="done()">' + btn + '</button><button class="nav" aria-label="Next row" onclick="browse(1)">›</button></div>' +
    '<div class="sheet' + (S.sheet || S.confirm ? ' show' : '') + '" onclick="if(event.target===this){S.confirm=null;sheet(null)}"><div class="in">' + sheets + '</div></div>';
  const lm = document.querySelector('.main.list');
  if (lm) {
    const selEl = lm.querySelector('.sel') || lm.querySelector('.rl li.sel');
    if (selEl) {
      const prev = selEl.previousElementSibling;
      const anchor = prev && prev.classList.contains('pr') ? prev : selEl;
      const top = lm.scrollTop + anchor.getBoundingClientRect().top - lm.getBoundingClientRect().top - 6;
      lm.scrollTop = S._lt != null ? S._lt : 0;
      lm.scrollTo({ top: Math.max(0, top), behavior: S._lt != null ? 'smooth' : 'auto' });
    }
    lm.addEventListener('scroll', () => { S._lt = lm.scrollTop; });
  } else { S._lt = null; }
  const cw = document.querySelector('.chart');
  if (cw) { const cur = cw.querySelector('[data-cur="1"]'); if (cur) cw.scrollTop = cur.offsetTop - cw.clientHeight / 2 + cur.offsetHeight / 2; }
  document.getElementById('ctl').innerHTML =
    [['chart', 'Chart row'], ['written', 'Written row'], ['repeat', 'Repeat']].map(([k, l]) => '<button class="' + (S.mode === k ? 'on' : '') + '" onclick="setMode(\'' + k + '\')">' + l + '</button>').join('') +
    '<button class="' + (S.list ? 'on' : '') + '" onclick="S.list=!S.list;render()">' + (S.list ? 'Playlist (tap to open player)' : 'Show playlist') + '</button>' +
    '<label><input type="checkbox" ' + (S.hideCount ? 'checked' : '') + ' onchange="S.hideCount=this.checked;render()">Count not computable</label>' +
    '<label><input type="checkbox" ' + (S.longIns ? 'checked' : '') + ' onchange="S.longIns=this.checked;render()">Long instruction</label>';
}
render();
</script>
</body>
</html>
